# frequency: 06:00:00 added by hand -- missing from v9cqd62s's own resolved ERA5 stream
# config (same gotcha as ni41n7gy/skkbxfya/hsq7hsb6/oliqngmf); without it the model produces
# hourly (6x) instead of 6-hourly physical output.
# Diffusion offset=1 / num_steps_input=1 override: relabels the model's sole loaded input
# step as "now" and its forecast step(s) as starting +1 x time_step ahead, so pgfp50c2's
# RMSE rollout aligns with a deterministic (offset=1) model's lead times. Only offset/policy/
# num_steps_input are pinned here -- forecast.num_steps is left unset so it inherits whatever
# training_config.forecast.num_steps is passed via --options (e.g. num_steps=40 for a full
# rollout). See the fe_diffusion_model_conditioning="forecast" branch in
# src/weathergen/model/model.py (stage=="inference" and tokens.shape[1]==1 and
# forecast_offset==1 path).
test_config:
  model_input:
    forecasting:
      num_steps_input: 1
  forecast:
    offset: 1
    policy: "fixed"
validation_config:
  losses:
    physical:
      type: LossPhysical
      weight: 0.0
      target_and_aux_calc: Physical
      loss_fcts:
        mse: {}
load_decoder_chkpt:
  run_id: v9cqd62s
  mini_epoch: -1
